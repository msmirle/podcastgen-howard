name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: DATA_DIR=/tmp/pg-data MEDIA_DIR=/tmp/pg-media docker compose config --quiet
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: podcastgen:test
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test fresh installs, persistence, uploads, and migrations
        run: python3 tests/integration.py podcastgen:test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in 3.2.9 latest "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            docker tag podcastgen:test "$image:$tag"
            docker push "$image:$tag"
          done
