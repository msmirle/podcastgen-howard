ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 1800
LimitRequestBody 1153433600

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "^(config\.php|composer\.(json|lock)|\..*)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /data>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<DirectoryMatch "^/(data|var/www/html)/(images|media)(/|$)">
    Require all granted
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
