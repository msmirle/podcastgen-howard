name: podcastgen-howard

services:
  app:
    image: ghcr.io/msmirle/podcastgen-howard:latest
    container_name: podcastgen-howard
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PUBLIC_URL=${PUBLIC_URL}
    volumes:
      - "${CONFIG_DIR}:/data"
      - "${MEDIA_DIR}:/data/media"
    ports:
      - "${WEBUI_PORT}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
